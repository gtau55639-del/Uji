name: Build VoiceX APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak ZIP otomatis (jika project masih berupa .zip)
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
              echo "Mengekstrak $z"
              unzip -oq "$z" -d _extracted
            done
          fi

      - name: Cari folder project
        id: proj
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan di repo. File project belum ke-upload."
            echo "Isi repo:"; ls -R | head -50
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project ada di: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceX-Gaming-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
